name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check deployment token is set
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUSHROOM_024228A10 }}" ]; then
            echo "::error::Deployment token secret is EMPTY."
            exit 1
          else
            echo "✅ Deployment token secret is present."
          fi

      - name: Install shared deps
        working-directory: packages/shared
        run: npm install zod

      - name: Install web deps
        working-directory: apps/web
        run: npm install

      - name: Build
        working-directory: apps/web
        run: npm run build

      # ──────────────────────────────────────────────────────────────
      # OPTIMIZE assets in the built dist so it fits Azure's 500 MiB cap.
      # Non-destructive: only touches dist, never the source assets.
      #  - GLB: Draco mesh compression + WebP textures @ 1K
      #  - loose .jpg/.png in .gltf folders: resize to 1K in place
      #
      # Texture size is the dominant runtime cost: a 2K texture decodes to ~16 MB
      # of VRAM each (regardless of its compressed bytes), and a scene with ~30 of
      # them pushes 400+ MB of VRAM + heavy main-thread decode → lag. 1K cuts that
      # 4× (~4 MB each) and is plenty for furniture/props at the viewing distance.
      # ──────────────────────────────────────────────────────────────
      - name: Optimize 3D assets to fit Azure SWA limit
        working-directory: apps/web/dist
        run: |
          echo "== Before =="
          du -sh .

          npm install -g @gltf-transform/cli

          echo "== Optimizing GLB models (Draco + WebP @1K) =="
          find . -type f -name '*.glb' | while read -r f; do
            before=$(du -h "$f" | cut -f1)
            tmp="${f%.glb}.__opt.glb"
            if gltf-transform optimize "$f" "$tmp" \
                 --compress draco \
                 --texture-compress webp \
                 --texture-size 1024 2>/dev/null; then
              mv "$tmp" "$f"
              echo "  ✓ $f: $before -> $(du -h "$f" | cut -f1)"
            else
              rm -f "$tmp"
              echo "  ! $f: optimize failed, kept original ($before)"
            fi
          done

          echo "== Optimizing standalone .gltf models (Draco + WebP @1K) =="
          # entry .gltf files (type f, not the .gltf-named folders)
          find . -type f -name '*.gltf' | while read -r f; do
            before=$(du -sh "$(dirname "$f")" | cut -f1)
            tmp="${f%.gltf}.__opt.gltf"
            if gltf-transform optimize "$f" "$tmp" \
                 --compress draco \
                 --texture-compress webp \
                 --texture-size 1024 2>/dev/null; then
              mv "$tmp" "$f"
              echo "  ✓ $f (folder $before -> $(du -sh "$(dirname "$f")" | cut -f1))"
            else
              rm -f "$tmp"
              echo "  ! $f: gltf-transform failed; falling back to plain texture resize"
            fi
          done

          echo "== Safety net: resize any remaining large loose textures in place =="
          find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | while read -r img; do
            mogrify -resize '1024x1024>' -quality 82 "$img" 2>/dev/null || true
          done

          echo "== After =="
          du -sh .

      - name: Diagnose dist size
        run: |
          DIST="apps/web/dist"; LIMIT=524288000; SUMMARY="$GITHUB_STEP_SUMMARY"
          TOTAL_BYTES=$(du -sb "$DIST" | cut -f1)
          TOTAL_HUMAN=$(du -sh "$DIST" | cut -f1)
          {
            echo "# 📦 Bundle Size Report (post-optimization)"
            echo ""
            echo "**Total dist:** \`$TOTAL_HUMAN\` ($TOTAL_BYTES bytes) — limit 500 MiB ($LIMIT)"
            if [ "$TOTAL_BYTES" -gt "$LIMIT" ]; then
              echo "**Status:** ❌ still over by $(( (TOTAL_BYTES - LIMIT) / 1048576 )) MiB"
            else
              echo "**Status:** ✅ under limit ($(( (LIMIT - TOTAL_BYTES) / 1048576 )) MiB headroom)"
            fi
            echo ""
            echo "## Top 30 largest files"
            echo '```'
            find "$DIST" -type f -printf '%s\t%p\n' | sort -rn | head -30 \
              | awk -F'\t' '{printf "%8.1f MB\t%s\n", $1/1048576, $2}'
            echo '```'
          } | tee "$SUMMARY"

      - name: Fail if dist exceeds Azure limit
        run: |
          TOTAL_BYTES=$(du -sb apps/web/dist | cut -f1)
          if [ "$TOTAL_BYTES" -gt 524288000 ]; then
            echo "::error::dist is $(( TOTAL_BYTES / 1048576 )) MiB, still over 500 MiB. See Job Summary."
            exit 1
          fi

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUSHROOM_024228A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "apps/web/dist"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUSHROOM_024228A10 }}
